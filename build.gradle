plugins {
	id 'net.fabricmc.fabric-loom' version '1.19.3'
	id 'maven-publish'
	id 'java-library'
}

version = project.mod_version
group = project.maven_group
mod_name = project.mod_name
mod_id = project.mod_id
loader_version_range = project.loader_version_range
minecraft_version_range = project.minecraft_version_range
java_version_range = project.java_version_range
cloth_config_version = project.cloth_config_version
modmenu_version = project.modmenu_version

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url "https://maven.shedaniel.me/"}
	maven { url "https://maven.terraformersmc.com/releases/"}

	// curse maven
	maven {
		url "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name 'mavenCentral'
		url 'https://repo.maven.apache.org/maven2/'
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
	inputs.property "version", version
	inputs.property "mod_id", mod_id
	inputs.property "mod_name", mod_name
	inputs.property "loader_version_range", loader_version_range
	inputs.property "minecraft_version_range", minecraft_version_range
	inputs.property "java_version_range", java_version_range
	inputs.property "cloth_config_version", cloth_config_version
	inputs.property "modmenu_version", modmenu_version

	filesMatching("fabric.mod.json") {
		expand  "version": version, "mod_id": mod_id, "mod_name": mod_name, "loader_version_range": loader_version_range,
				"minecraft_version_range": minecraft_version_range, "java_version_range": java_version_range,
				"cloth_config_version" : cloth_config_version, "modmenu_version": modmenu_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
